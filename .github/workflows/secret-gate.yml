name: Secret gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Reject added keys
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The pushed range is diffed, so both endpoints must be present.
          fetch-depth: 0

      - name: Self-test the patterns
        run: bin/check-secrets.sh --self-test

      - name: Scan the added lines of this push or pull request
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          zero="0000000000000000000000000000000000000000"
          if [ -n "${PR_BASE:-}" ]; then
            range="${PR_BASE}...${HEAD_SHA}"
          elif [ -n "${EVENT_BEFORE:-}" ] && [ "${EVENT_BEFORE}" != "${zero}" ]; then
            range="${EVENT_BEFORE}..${HEAD_SHA}"
          else
            base="$(git merge-base HEAD "origin/${DEFAULT_BRANCH}")"
            range="${base}..${HEAD_SHA}"
          fi
          echo "secret gate scanning ${range}"
          bin/check-secrets.sh --range "${range}"
